<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="PaperLens turns PDFs, scans, and OCR output into clean, editable documents. Local-first and private by default."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>PaperLens</title>
    <script>
      // Applies the stored theme before first paint to avoid a theme flash.
      // Keep this key in sync with src/app/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('paperlens.theme');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
